name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.platform.release_for }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - release_for: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - release_for: macOS-ARM
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # A failing test stops the job before anything is uploaded.
      - name: Run tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.platform.target }}

      - name: Prepare assets
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          asset="repobundle-${{ matrix.platform.release_for }}"
          mv repobundle "$asset"

          # sha256sum on Linux, shasum elsewhere
          if command -v sha256sum >/dev/null; then checksum="sha256sum"; else checksum="shasum -a 256"; fi
          $checksum "$asset" > "$asset.sha256"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.platform.target }}/release/repobundle-${{ matrix.platform.release_for }}
            target/${{ matrix.platform.target }}/release/repobundle-${{ matrix.platform.release_for }}.sha256

  upload-completions:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive completion scripts
        run: tar -czf completions.tar.gz completions

      - name: Upload completion scripts
        uses: softprops/action-gh-release@v2
        with:
          files: completions.tar.gz
